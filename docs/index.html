<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EquiWorks</title>
<link rel="icon" type="image/png" href="favicon.png?v=80">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=80">
<script>try{if(localStorage.getItem("stalljour.theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
</head>
<body>
<header class="app">
  <div class="logo"><span class="logomark" aria-hidden="true"></span>EquiWorks</div>
  <div class="spacer"></div>
  <div class="menuwrap">
    <button class="btn sm" id="btnSchedule" style="display:none"><span class="islot" data-icon="calendar"></span><span class="lbl"> Schema</span></button>
    <div class="menu" id="scheduleMenu"></div>
  </div>
  <div class="menuwrap">
    <button class="btn sm" id="btnMine" style="display:none"><span class="islot" data-icon="list"></span><span class="lbl"> Mina pass</span></button>
    <div class="menu" id="mineMenu"></div>
  </div>
  <div class="menuwrap">
    <button class="btn sm" id="btnChat" style="display:none"><span class="islot" data-icon="message"></span><span class="lbl"> Chatt</span></button>
    <div class="menu" id="chatMenu"></div>
  </div>
  <div class="menuwrap">
    <button class="btn sm" id="btnSettings" style="display:none"><span class="islot" data-icon="settings"></span><span class="lbl"> Inställningar</span></button>
    <div class="menu" id="settingsMenu"></div>
  </div>
  <div class="menuwrap">
    <button class="btn sm" id="btnProfile" style="display:none"><span class="islot" data-icon="user"></span><span class="lbl"> Profil</span></button>
    <div class="menu" id="profileMenu"></div>
  </div>
  <div class="menuwrap">
    <button class="btn ghost sm bellbtn" id="btnBell" style="display:none" title="Notiser"><span class="islot" data-icon="bell"></span><span class="badge" id="bellBadge" style="display:none"></span></button>
    <div class="menu bellmenu" id="bellMenu"></div>
  </div>
  <button class="btn ghost sm" id="btnTheme" title="Byt mellan ljust och mörkt läge"></button>
  <div class="menuwrap mobonly">
    <button class="btn sm" id="btnBurger" style="display:none" title="Meny"><span class="islot" data-icon="menu"></span></button>
    <div class="menu" id="burgerMenu"></div>
  </div>
</header>
<div class="wrap"><div id="app"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=80"></script>
<script src="app.js?v=80"></script>
</body>
</html>
